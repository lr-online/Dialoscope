# Agent Configurations
# Define settings for each agent participating in the debate.
agents:
  proponent: # 正方
    provider: ollama
    model: gemma3:latest
    # Optional: Define a specific prompt template or path to a prompt file
    # prompt: "You are the proponent arguing vigorously for the motion..."
    # prompt_file: "prompts/proponent.txt"

  opponent: # 反方
    provider: ollama
    model: qwen2.5:latest
    # prompt: "You are the opponent arguing strongly against the motion..."

  judge: # 评审
    provider: openai
    model: gpt-4o-mini
    # prompt: "You are the impartial judge, evaluating the arguments based on logic and evidence..."

# LLM Provider Configurations
# Define connection details for each LLM provider used by the agents.
providers:
  openai:
    enabled: true
    # Ensure you have OPENAI_API_KEY set as an environment variable
    # Alternatively, you can uncomment and set the api_key directly here (less recommended)
    # api_key: "sk-..."
    # base_url: "https://api.openai.com/v1" # Optional: Override for OpenAI-like APIs

  ollama:
    base_url: "http://localhost:11434" # Default Ollama API endpoint
    # Optional: Specify request timeout in seconds
    # timeout: 60

  # anthropic:
  #   api_key: "YOUR_ANTHROPIC_KEY_HERE"
  #   # base_url: "https://api.anthropic.com/v1" # Check Anthropic docs for correct URL